services:
  postgres:
    image: postgres:15-alpine
    container_name: financial-doc-postgres
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_pass
      POSTGRES_DB: financial_doc_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_doc_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - financial-network

  redis:
    image: redis:7-alpine
    container_name: financial-doc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - financial-network

volumes:
  postgres_data:
  redis_data:

networks:
  financial-network:
    driver: bridge
